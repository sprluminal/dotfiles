---
name: shellcheck
# yamllint disable-line rule:truthy
on:
  push:
    branches:
      - main
    paths:
      - '**/*.sh'
  pull_request:
    branches:
      - main
    paths:
      - '**/*.sh'
jobs:
  lint:
    name: Check shell scripts with shellcheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Run shellcheck
        uses: ludeeus/action-shellcheck@master
        with:
          ignore_names: >-
            .zshrc  .profile
