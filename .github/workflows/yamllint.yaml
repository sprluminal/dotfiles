---
name: yamllint
# yamllint disable-line rule:truthy
on:
  push:
    branches:
      - main
    paths:
      - '**/*.yaml'
  pull_request:
    branches:
      - main
    paths:
      - '**/*.yaml'
jobs:
  lint:
    name: Check yaml with yamllint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Run yamllint
        uses: ibiqlik/action-yamllint@v3
        with:
          strict: true
